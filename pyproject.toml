[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "luca-fis-tools"
version = "0.1.0"
description = "Validate and split journal voucher import files for Luca."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
luca-fis = "luca_fis_tools.cli:main"

[tool.setuptools]
packages = ["luca_fis_tools"]
